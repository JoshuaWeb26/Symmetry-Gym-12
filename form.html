<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoja de compra</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>

  <h1>SYMMETRY GYM</h1>
  <p class="index-one">Por favor realice la siguiente hoja de compra</p>

  <div class="page-buy">
    <form>
      <h2>A continuación tus datos</h2>
      
      <fieldset>
        <legend>Información Básica</legend>
        <input type="text" placeholder="Tu Nombre">
        <input type="email" placeholder="Tu email">
        <input type="password" placeholder="Tu contraseña">
        
        <label>Tu fecha de nacimiento
          <input type="date">
        </label>
        
        <label>Acepto que soy mayor de 13 años
          <input type="checkbox">
        </label>
      </fieldset>

      <fieldset>
        <legend>Información de pago</legend>
        <label>Métodos de pago
          <select name="metodo-de-pago">
            <option value="metodo 1">Tarjeta de crédito/débito</option>
            <option value="metodo 2">Paypal</option>
            <option value="metodo 3">MasterCard / Visa</option>
            <option value="metodo 4">Transferencia</option>
            <option value="metodo 5">Tarjeta de regalo</option>
          </select>
        </label>
      </fieldset>

      <input type="submit" value="Subir">
    </form>
  </div>

  <div>
    <h2>Gracias por elegirnos, Aquí está tu producto</h2>
    <a href="form.html" download="form.html">Symmetry Gym PDF</a>
  </div>

  <p>A continuación uno de los que lograron el éxito</p>
  
  <video controls autoplay muted src="DAVID16LAID14.mp4"></video>

  <footer>
    <p>2026 - 2027 Atlas Program - Un paso Adelante</p>
  </footer>

</body>
</html>
